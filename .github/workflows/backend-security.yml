name: Application checks
on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/backend-security.yml"
  push:
    branches:
      - main
      - design/macos-food-ui
      - security/hardening-favorcito
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/backend-security.yml"
permissions:
  contents: read
jobs:
  backend:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_TEST_URI: mongodb://127.0.0.1:27019/?replicaSet=favorcitoTest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Start isolated MongoDB replica set
        run: |
          docker run --detach --name favorcito-mongo --publish 27019:27019 mongo:8.0 --replSet favorcitoTest --bind_ip_all --port 27019
          for attempt in $(seq 1 60); do
            if docker exec favorcito-mongo mongosh --port 27019 --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec favorcito-mongo mongosh --port 27019 --quiet --eval 'rs.initiate({_id:"favorcitoTest",members:[{_id:0,host:"127.0.0.1:27019"}]})'
          mongo_primary=false
          for attempt in $(seq 1 60); do
            if docker exec favorcito-mongo mongosh --port 27019 --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then
              mongo_primary=true
              break
            fi
            sleep 1
          done
          test "$mongo_primary" = true
      - name: Run all tests (MongoDB is required)
        run: npm run test:integration
      - run: npm audit --omit=dev
      - name: MongoDB diagnostics
        if: failure()
        run: docker logs favorcito-mongo
      - name: Stop test database
        if: always()
        run: docker rm --force favorcito-mongo
  frontend:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run build
      - run: npm audit --omit=dev
